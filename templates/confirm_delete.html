{% extends 'base.html' %}

{% block styles %}
<!-- Someday, Today, comfirmation page -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/saved_runs.css') }}">
{% endblock %}

{% block container %}
<div class="saved_runs-page">
    <h1>Remove run?</h1>
    
    <div class="confirm-card">
    <p>Remove {{ document.run.name }} from {{ document.list }}? </p>
    
    <form method="GET" action="{{ url_for(document.list) }}">
        <button type="submit">Cancel</button> 
    </form>

    <form method="POST" action="{{ url_for('delete_saved_post', saved_id=document._id) }}">
        <button type="submit" class="removeb"> Yes, remove!</button>
    </form>
    </div>
</div>
{% endblock %}
