{% extends 'base.html' %}
{% block container %}
<section class="find-page">
  <h1>Log in</h1>
  <form class="find-form-box" method="POST" action="{{ url_for('authenticate_account') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="254" autocomplete="email" value="{{ request.form.get('email', '') }}" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
    <button class="primary" type="submit">Log in</button>
  </form>
  <p>
    New to Ski-Oked? <a href="{{ url_for('show_signup_form') }}">Create an account</a>.
  </p>
</section>
{% endblock %}
