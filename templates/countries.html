{% extends 'base.html' %}
{% block container %}
<section class="find-page">
  <h1>Find a run</h1>
  <form class="find-form-box" method="GET">
    <label for="country">Country</label>
    <select id="country" name="country" required>
      <option value="">Choose a country</option>
      {% for doc in docs %}<option value="{{ doc._id }}">{{ doc.name }}</option>{% endfor %}
    </select>
    <button class="primary" type="submit">Show resorts</button>
  </form>
</section>
{% endblock %}
