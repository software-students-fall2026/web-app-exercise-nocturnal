{% extends 'base.html' %}

{% block container %}
<h1>{{ 'Edit attempt' if document._id else 'Log attempt' }}</h1>
<p>{{ run.name }}</p>

<form action="{{ url_for('attempt_post', attempt_id=document._id) if document._id else url_for('log_attempt_post', run_id=run._id) }}" method="POST">
  <p>
    <label for="skied_at">Date (UTC)</label>
    <input id="skied_at" name="skied_at" type="datetime-local" value="{{ document.skied_at.strftime('%Y-%m-%dT%H:%M') }}" required>
  </p>
  <p>
    <label for="difficulty_rating">Difficulty</label>
    <select id="difficulty_rating" name="difficulty_rating">
      <option value="">Not rated</option>
      {% for category in difficulties %}
        <option value="{{ category }}" {% if document.difficulty_rating == category %}selected{% endif %}>{{ category }}</option>
      {% endfor %}
    </select>
  </p>
  <p>
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="4" cols="25">{{ document.notes }}</textarea>
  </p>

  <button type="submit">Save</button>
</form>

{% if document._id %}
  <form action="{{ url_for('delete_attempt_post', attempt_id=document._id) }}" method="POST"
    onsubmit="return confirm('Delete this attempt?');">
    <button type="submit">Delete</button>
  </form>
{% endif %}

{% if document._id %}
  <p><a href="{{ url_for('attempt', attempt_id=document._id) }}">Cancel</a></p>
{% endif %}

<p><a href="{{ url_for('run_details', run_id=run._id) }}">Back to run</a></p>
{% endblock %}
