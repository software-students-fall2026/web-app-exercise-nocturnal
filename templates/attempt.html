
{% extends 'base.html' %}

{% block container %}
<h1>{{ 'Edit attempt' if document._id else 'Log attempt' }}</h1>
<p>{{ run.name }}</p>

<form action="{{ url_for('attempt_post', attempt_id=document._id) if document._id else url_for('log_attempt_post', run_id=run._id) }}" method="POST">

  <p>
    <label for="skied_at">Date (UTC)</label>
    <input
      id="skied_at"
      name="skied_at"
      type="datetime-local"
      value="{{ document.skied_at.strftime('%Y-%m-%dT%H:%M') }}"
      required
    >
  </p>

  <fieldset>
    <legend>Did you complete this run?</legend>

    <label for="completed_yes">
      <input
        type="radio"
        id="completed_yes"
        name="completed"
        value="yes"
        {% if document.completed is sameas true %}checked{% endif %}
        required
      >
      Yes
    </label>

    <label for="completed_no">
      <input
        type="radio"
        id="completed_no"
        name="completed"
        value="no"
        {% if document.completed is sameas false %}checked{% endif %}
        required
      >
      No
    </label>
  </fieldset>

  <p>
    <label for="difficulty_rating">Difficulty</label>
    <select id="difficulty_rating" name="difficulty_rating">
      <option value="">Not rated</option>
      {% for category in difficulties %}
        <option value="{{ category }}"
          {% if document.difficulty_rating == category %}selected{% endif %}>
          {{ category }}
        </option>
      {% endfor %}
    </select>
  </p>

  <p>
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="4" cols="25">{{ document.notes }}</textarea>
  </p>

  <button type="submit">Save</button>
</form>

{% if document._id %}
  <form action="{{ url_for('delete_attempt_post', attempt_id=document._id) }}" method="POST">
    <button type="submit">Delete</button>
  </form>
{% endif %}

<p>
  <a href="{{ url_for('run_details', run_id=run._id) }}">Back to run</a>
</p>
{% endblock %}
