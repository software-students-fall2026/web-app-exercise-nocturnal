<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

    {% block styles %}{% endblock %}    
    
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ski App</title>
  </head>
  <body>
    <header class="site-header">
      <a class="site-brand" href="{{ url_for('home') }}">Ski App</a>

      <details class="site-menu">
        <summary>
          <span></span>
          <span></span>
          <span></span>
        </summary>

        <nav>
          <a href="{{ url_for('find_runs') }}">Find a run</a>
          <a href="{{ url_for('someday') }}">Someday</a>
          <a href="{{ url_for('today') }}">Today</a>
          <a href="{{ url_for('history') }}">History</a>
        </nav>
      </details>
    </header>

    <main>
      {% block container %}{% endblock %}
    </main>
    <footer>
      <p>designed lovingly by team nocturnal</p>
      <p>data sourced from OpenSkiData / OpenSkiMap.org</p>
      <p>© 2026 team nocturnal</p>
    </footer>
  </body>
</html>
